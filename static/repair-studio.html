<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
<title>在线编辑</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/tailwindcss-cdn.js?v=2026.08.25.1787217318"></script>
    <script src="/static/vendor/js/lucide.js?v=2026.08.25.1787217318"></script>
    <script src="/static/js/theme.js?v=2026.08.25.1787217318"></script>
    <script src="/static/js/i18n.js?v=2026.08.25.1787217317"></script>
    <style>
        @import url('/static/vendor/css/fonts.css?v=2026.08.25.1787217318');
        :root { --accent:#111827; --bg:#f9fafb; --card:#fff; --easing:cubic-bezier(0.4,0,0.2,1); }
        body { background:var(--bg); font-family:'Inter',-apple-system,sans-serif; color:var(--accent); -webkit-font-smoothing:antialiased; }
        .container-box { max-width:1280px; margin:0 auto; padding:0 40px; margin-top:50px; }
        .nano-input { background:var(--card); border:1px solid #eef0f2; transition:all .3s var(--easing); }
        .nano-input:focus { border-color:#000; box-shadow:0 0 0 1px #000; }
        .upload-item { background:var(--card); border:1px solid #e2e8f0; transition:all .4s var(--easing); position:relative; overflow:hidden; }
        .upload-item:hover,.upload-item.drag-over { border-color:#000; transform:translateY(-2px); }
        .preview-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; animation:fadeIn .5s var(--easing); }
        .glass-btn { background:#111827; transition:all .3s var(--easing); }
        .glass-btn:hover { background:#000; transform:translateY(-1px); box-shadow:0 12px 24px rgba(0,0,0,.1); }
        .result-frame { background:#fff; border-radius:32px; border:1px solid #f1f5f9; box-shadow:0 2px 15px rgba(0,0,0,.02); }
        .tool-panel { background:#fff; border:1px solid #edf0f3; border-radius:24px; padding:12px; display:flex; flex-direction:column; gap:10px; }
        .model-pill { background:#f8fafc; border:1px solid #edf2f7; border-radius:999px; padding:3px; display:grid; grid-template-columns:1fr 1fr; gap:2px; }
        .model-option { border-radius:999px; height:34px; display:flex; align-items:center; justify-content:center; gap:6px; color:#64748b; font-size:10px; font-weight:600; letter-spacing:.02em; transition:all .25s var(--easing); }
        .model-option.active { background:#fff; color:#111827; box-shadow:0 1px 3px rgba(15,23,42,.08); }
        .control-panel { background:#fff; border:1px solid #edf0f3; border-radius:24px; padding:12px; display:flex; flex-direction:column; gap:10px; }
        .control-label { display:flex; align-items:center; gap:6px; color:#94a3b8; font-size:10px; font-weight:600; letter-spacing:.04em; }
        .size-row { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; align-items:start; }
        .size-field { min-width:0; display:flex; flex-direction:column; gap:6px; }
        .size-select,.size-custom { width:100%; min-width:0; max-width:100%; height:34px; border:1px solid #edf2f7; border-radius:14px; background:#f8fafc; color:#111827; outline:none; padding:0 10px; font-size:11px; font-weight:700; }
        .size-select { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .size-select:disabled { opacity:.55; cursor:not-allowed; }
        .size-custom { display:none; background:#fff; }
        .size-field.custom .size-custom { display:block; }
        .size-pair { display:none; grid-template-columns:1fr 1fr; gap:6px; }
        .size-field.custom .size-pair { display:grid; }
        .size-pair .size-custom { display:block; }
        .size-pair.with-fit { grid-template-columns:1fr 1fr auto; align-items:center; }
        .size-fit-btn { height:34px; border:1px solid #edf2f7; border-radius:14px; background:#fff; color:#111827; padding:0 10px; font-size:10px; font-weight:800; white-space:nowrap; }
        .size-fit-btn:disabled { opacity:.45; cursor:not-allowed; }
        .mode-badge { font-size:9px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:#0f172a; background:#eef2ff; border:1px solid #e0e7ff; padding:2px 8px; border-radius:999px; }
        @media (max-width:640px){ .size-row{ grid-template-columns:1fr; } }
        .generation-loader { display:flex; align-items:center; justify-content:center; width:100%; min-height:320px; }
        .generation-loader-wrapper { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; width:120px; font-family:'Inter',sans-serif; user-select:none; }
        .generation-loader-animation { position:relative; width:120px; height:120px; display:flex; align-items:center; justify-content:center; }
        .generation-loader-animation div { position:absolute; width:30px; height:30px; animation:generation-loader-move 4s infinite; }
        .generation-loader-animation div:nth-child(1) { background:#9e88f6; box-shadow:#9e88f6 0 7px 29px 0; transform:translate(-30px,-30px); animation-delay:-1s; }
        .generation-loader-animation div:nth-child(2) { background:#61b7fd; box-shadow:#61b7fd 0 7px 29px 0; transform:translate(30px,-30px); animation-delay:-2s; }
        .generation-loader-animation div:nth-child(3) { background:#5ff9af; box-shadow:#5ff9af 0 7px 29px 0; transform:translate(30px,30px); animation-delay:-3s; }
        .generation-loader-animation div:nth-child(4) { background:#f3ab59; box-shadow:#f3ab59 0 7px 29px 0; transform:translate(-30px,30px); animation-delay:-4s; }
        .generation-loader-copy { display:flex; flex-direction:column; align-items:center; gap:4px; color:#111827; text-align:center; }
        .generation-loader-title { font-size:14px; font-weight:800; letter-spacing:.02em; }
        .generation-loader-elapsed { font-size:13px; font-weight:900; letter-spacing:0; }
        .studio-theme-dark .generation-loader-copy { color:#fff; text-shadow:0 1px 8px rgba(0,0,0,.4); }
        @keyframes generation-loader-move {
            0%,100% { transform:translate(-30px,-30px); }
            25% { transform:translate(30px,-30px); }
            50% { transform:translate(30px,30px); }
            75% { transform:translate(-30px,30px); }
        }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }
        .repair-compact header { margin-bottom:8px; }
        .repair-compact header h1 { font-size:24px; line-height:1.15; }
        .repair-compact .project-bar { margin-bottom:8px; }
        .repair-compact .project-tab { min-width:88px; height:32px; padding:0 10px; border-radius:9px; font-size:12px; }
        .repair-compact .add-project { width:32px; height:32px; border-radius:9px; }
        .repair-compact main.grid { gap:16px; }
        .repair-left { display:grid; gap:8px; min-width:0; }
        .repair-left .space-y-4 > * + * { margin-top:6px; }
        .repair-compact .nano-input { min-height:68px; padding:8px 12px; border-radius:12px; font-size:12px; }
        .repair-compact #promptInput { min-height:0; padding:24px; border-radius:24px; font-size:14px; line-height:1.25rem; }
        .repair-compact .upload-item { aspect-ratio:4 / 3; border-radius:12px; }
        .repair-compact .repair-toolbar { gap:6px; }
        .repair-compact .repair-tool { min-height:30px; padding:0 8px; border-radius:8px; font-size:11px; }
        .repair-compact .tool-panel { gap:6px; padding:8px; border-radius:14px; }
        .repair-compact .size-row { gap:6px; }
        .repair-compact .size-select { height:30px; border-radius:9px; font-size:10px; }
        .repair-compact .size-custom { height:30px; border-radius:9px; font-size:10px; }
        .repair-compact .size-fit-btn { height:30px; border-radius:9px; font-size:9px; }
        .repair-compact #genBtn { padding-top:10px; padding-bottom:10px; border-radius:16px; box-shadow:none; }
        #repairStage { aspect-ratio:4 / 3; min-height:0; border:1px solid #cbd5e1; border-radius:16px; background:#f8fafc; box-shadow:none; }
        .image-bounds { position:absolute; z-index:2; border:0; border-radius:8px; pointer-events:none; display:none !important; }
        .image-bounds.guide { inset:6%; display:none !important; }
        .timeline-frame { margin-top:12px; min-height:150px; border:1px solid #cbd5e1; border-radius:16px; background:transparent; padding:10px; }
        .repair-compact .timeline-list { gap:8px; margin:0; }
        .repair-compact .timeline-item { padding:6px; border-radius:10px; }
        .repair-compact .timeline-outputs { width:48px; min-height:36px; }
        .project-bar { display:flex; align-items:center; gap:8px; margin-bottom:18px; }
        .project-tabs { display:flex; align-items:center; gap:8px; min-width:0; overflow-x:auto; scrollbar-width:none; padding:2px; }
        .project-tabs::-webkit-scrollbar { display:none; }
        .project-tab { flex:0 0 auto; min-width:112px; height:40px; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 14px; border:1px solid #e5e7eb; border-radius:12px; background:#fff; color:#1f2937; font-size:13px; font-weight:500; }
        .project-tab:hover { border-color:#d9dce1; }
        .project-tab.active { background:#111827; border-color:#111827; color:#fff; }
        .project-title-input { flex:0 1 auto; width:auto; min-width:2ch; max-width:calc(100% - 14px); height:24px; padding:1px 3px; border:1px solid #9ca3af; border-radius:3px; background:#fff; color:#111827; font:inherit; outline:none; }
        .project-tab.active .project-title-input { border-color:#9ca3af; }
        .project-dot { width:6px; height:6px; border-radius:50%; background:#c7cbd1; }
        .project-tab.running .project-dot { background:#2563eb; animation:pulse 1.2s infinite; }
        .project-tab.done .project-dot { background:#16a34a; }
        .add-project { flex:0 0 auto; width:40px; height:40px; display:grid; place-items:center; border:1px solid #e5e7eb; border-radius:12px; background:#fff; color:#1f2937; }
        .add-project:hover { background:#f6f7f8; }
        .repair-toolbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
        .repair-tool { display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 11px; border:1px solid #e5e7eb; border-radius:10px; background:#fff; color:#1f2937; font-size:12px; }
        .repair-tool.active { background:#111827; border-color:#111827; color:#fff; }
        .stage-layer { position:absolute; inset:0; opacity:0; pointer-events:none; }
        .stage-layer.active { opacity:1; pointer-events:auto; }
        .stage-layer canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
        .maskCanvas { cursor:default; touch-action:none; }
        .stage-layer.has-source .maskCanvas { cursor:crosshair; }
        #repairStage.drag-over { border-color:#2563eb; box-shadow:0 0 0 2px rgba(37,99,235,.18); }
        .timeline-list { list-style:none; margin:12px 0 0; padding:0; display:grid; gap:10px; max-height:380px; overflow:auto; }
        .timeline-item { display:grid; grid-template-columns:64px minmax(0,1fr); gap:10px; padding:8px; border:1px solid #e5e7eb; border-radius:12px; background:#f6f7f8; }
        .timeline-outputs { width:64px; min-height:48px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:3px; }
        .timeline-output { min-width:0; min-height:0; padding:0; overflow:hidden; border:1px solid transparent; border-radius:7px; background:#e9ebee; cursor:pointer; }
        .timeline-output:only-child { grid-column:span 2; }
        .timeline-output.active { border-color:#2563eb; box-shadow:0 0 0 1px #2563eb; }
        .timeline-output img { width:100%; height:100%; object-fit:cover; display:block; }
        .timeline-output.state { display:grid; place-items:center; cursor:default; }
        .timeline-meta { display:grid; gap:4px; min-width:0; }
        .timeline-item.running .state { color:#2563eb; }
        .timeline-item.done .state { color:#16a34a; }
        .timeline-item.failed .state { color:#dc2626; }
        .timeline-desc { margin:0; color:#6b7280; font-size:12px; overflow-wrap:anywhere; }
        .continue-btn { display:inline-flex; align-items:center; gap:6px; padding:0; background:transparent; border:0; color:#111827; font-size:11px; }
        .continue-btn:disabled { color:#6b7280; cursor:not-allowed; }
        .spinner { width:18px; height:18px; border-radius:50%; border:2px solid #d9dce1; border-top-color:#111827; animation:spin 1s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>

<body>
    <div class="container-box min-h-screen flex flex-col repair-compact">
        <header class="flex justify-between items-end mb-16">
            <div class="space-y-1">
                <h1 class="text-4xl font-extrabold tracking-tighter italic" data-i18n="nav.repairStudio">在线编辑</h1>
                <p class="text-[10px] font-bold uppercase tracking-[0.4em] text-gray-400">PROJECT MASK REPAIR STUDIO</p>
            </div>
            <nav class="hidden md:flex gap-8 text-[11px] font-bold uppercase tracking-widest text-gray-400">
                <span class="text-black border-b-2 border-black pb-1" data-i18n="online.create">Create</span>
            </nav>
        </header>

        <div class="project-bar">
            <div id="projectTabs" class="project-tabs" role="tablist" aria-label="修复项目"></div>
            <button id="addProjectBtn" class="add-project" type="button" title="新建项目" aria-label="新建项目">＋</button>
            <span id="projectCount" class="pill">2 个项目</span>
        </div>
        <main class="grid grid-cols-1 lg:grid-cols-12 gap-12">
            <div class="lg:col-span-5 repair-left">
                <section class="space-y-4">
                    <div class="flex items-center gap-2 text-gray-400">
                        <i data-lucide="terminal" class="w-3.5 h-3.5"></i>
                        <span class="text-[10px] font-black uppercase tracking-widest">修复说明</span>
                    </div>
                    <textarea id="promptInput" rows="5" class="nano-input w-full p-6 rounded-3xl text-sm outline-none resize-none placeholder-gray-300" placeholder="例如：把遮罩位置修复干净，保持原有材质和光线"></textarea>
                </section>

                <section class="space-y-4">
                    <div class="flex items-center gap-2 text-gray-400">
                        <i data-lucide="images" class="w-3.5 h-3.5"></i>
                        <span class="text-[10px] font-black uppercase tracking-widest" data-i18n="online.referenceImages">Reference Images</span>
                    </div>
                    <input type="file" id="file1" accept="image/*" class="hidden" onchange="handleFile(this.files[0],1)">
                    <div class="grid grid-cols-3 gap-4">
                        <div id="drop-zone-1" onclick="document.getElementById('file1').click()" class="upload-item group aspect-square rounded-2xl flex flex-col items-center justify-center cursor-pointer">
                            <i data-lucide="plus" class="w-5 h-5 text-gray-300 group-hover:text-black"></i><span class="text-[9px] mt-2 font-bold text-gray-400 uppercase">Main</span>
                        </div>
                        <div id="drop-zone-2" onclick="document.getElementById('file2').click()" class="upload-item group aspect-square rounded-2xl flex flex-col items-center justify-center cursor-pointer">
                            <input type="file" id="file2" accept="image/*" class="hidden" onchange="handleFile(this.files[0],2)">
                            <i data-lucide="plus" class="w-5 h-5 text-gray-300 group-hover:text-black"></i><span class="text-[9px] mt-2 font-bold text-gray-400 uppercase">Aux A</span>
                            <img id="prev2" class="preview-img hidden"><button id="del2" onclick="clearSlot(2,event)" class="hidden absolute top-2 right-2 w-6 h-6 bg-white/90 rounded-full shadow-sm z-10">×</button>
                        </div>
                        <div id="drop-zone-3" onclick="document.getElementById('file3').click()" class="upload-item group aspect-square rounded-2xl flex flex-col items-center justify-center cursor-pointer">
                            <input type="file" id="file3" accept="image/*" class="hidden" onchange="handleFile(this.files[0],3)">
                            <i data-lucide="plus" class="w-5 h-5 text-gray-300 group-hover:text-black"></i><span class="text-[9px] mt-2 font-bold text-gray-400 uppercase">Aux B</span>
                            <img id="prev3" class="preview-img hidden"><button id="del3" onclick="clearSlot(3,event)" class="hidden absolute top-2 right-2 w-6 h-6 bg-white/90 rounded-full shadow-sm z-10">×</button>
                        </div>
                    </div>
                </section>

                <section class="space-y-4">
                    <div class="flex items-center gap-2 text-gray-400">
                        <i data-lucide="brush" class="w-3.5 h-3.5"></i>
                        <span class="text-[10px] font-black uppercase tracking-widest">Mask</span>
                    </div>
                    <div class="repair-toolbar">
                        <button id="toolMask" class="repair-tool active" type="button">遮罩</button>
                        <button id="toolErase" class="repair-tool" type="button">擦除</button>
                        <label class="flex items-center gap-2 text-xs text-gray-500">笔刷
                            <input id="brushSize" type="range" min="10" max="90" value="30" class="w-32 accent-black">
                            <output id="brushValue">30</output>
                        </label>
                        <button id="clearMask" class="repair-tool" type="button">清空</button>
                    </div>
                </section>

                <div class="tool-panel">
                    <div class="control-label">
                        <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i>
                        <span data-i18n="online.model">Model</span>
                        <span id="providerModeBadge" class="mode-badge" style="margin-left:auto;display:none;"></span>
                    </div>
                    <div class="size-row">
                        <label class="size-field">
                            <select id="providerSelect" class="size-select" onchange="setProvider(this.value)"></select>
                        </label>
                        <label class="size-field">
                            <select id="modelSelect" class="size-select" onchange="setModel(this.value)"></select>
                        </label>
                    </div>
                    <div id="adaptiveExtras" class="size-row" style="margin-top:2px;">
                        <label id="qualityField" class="size-field">
                            <select id="qualitySelect" class="size-select" onchange="setQuality(this.value)" title="Quality">
                                <option value="auto" data-i18n="online.qualityAuto">自动</option>
                                <option value="low" data-i18n="online.qualityLow">低</option>
                                <option value="medium" data-i18n="online.qualityMedium">中</option>
                                <option value="high" data-i18n="online.qualityHigh">高</option>
                            </select>
                        </label>
                        <label id="countField" class="size-field">
                            <select id="countSelect" class="size-select" onchange="setCount(this.value)" title="Count">
                                <option value="1" selected>×1</option>
                                <option value="2">×2</option>
                                <option value="3">×3</option>
                                <option value="4">×4</option>
                            </select>
                        </label>
                    </div>
                    <div class="control-label mt-1">
                        <i data-lucide="ruler" class="w-3.5 h-3.5"></i>
                        <span data-i18n="online.size">Size</span>
                    </div>
                    <div class="size-row">
                        <label id="resolutionField" class="size-field">
                            <select id="resolutionSelect" class="size-select" onchange="setResolution(this.value)">
                                <option value="1k" selected>1K</option>
                                <option value="2k">2K</option>
                                <option value="4k">4K</option>
                                <option value="custom" data-i18n="online.customSize">自定义尺寸</option>
                            </select>
                            <span class="size-pair with-fit">
                                <input id="sizeCustomWidth" class="size-custom" type="number" min="64" step="64" placeholder="宽度" data-i18n-placeholder="online.width" oninput="setCustomSize()">
                                <input id="sizeCustomHeight" class="size-custom" type="number" min="64" step="64" placeholder="高度" data-i18n-placeholder="online.height" oninput="setCustomSize()">
                                <button id="fitImageSizeBtn" class="size-fit-btn" type="button" onclick="fitCustomSizeToImage(event)">适配图片</button>
                            </span>
                        </label>
                        <label id="ratioField" class="size-field">
                            <select id="ratioSelect" class="size-select" onchange="setRatio(this.value)">
                                <option value="" data-i18n="online.emptyRatio">比例为空</option>
                                <option value="square" selected data-i18n="online.square">1:1 方图</option>
                                <option value="portrait" data-i18n="online.portrait">2:3 竖图</option>
                                <option value="landscape" data-i18n="online.landscape">3:2 横图</option>
                                <option value="portrait43">3:4 竖图</option>
                                <option value="landscape43">4:3 横图</option>
                                <option value="story" data-i18n="online.story">9:16 竖屏</option>
                                <option value="wide" data-i18n="online.wide">16:9 宽屏</option>
                                <option value="custom" data-i18n="online.customRatio">自定义比例</option>
                            </select>
                            <span class="size-pair">
                                <input id="ratioCustomWidth" class="size-custom" type="number" min="1" step="1" placeholder="宽" data-i18n-placeholder="online.ratioWidth" oninput="setCustomRatio()">
                                <input id="ratioCustomHeight" class="size-custom" type="number" min="1" step="1" placeholder="高" data-i18n-placeholder="online.ratioHeight" oninput="setCustomRatio()">
                            </span>
                        </label>
                    </div>
                </div>

                <button id="genBtn" onclick="submitRepair()" class="glass-btn w-full py-5 text-white rounded-3xl font-bold flex items-center justify-center gap-3 shadow-lg">
                    <i data-lucide="zap" class="w-4 h-4 text-yellow-400"></i>
                    <span class="tracking-[0.3em] text-[11px] uppercase" data-i18n="online.generate">Generate</span>
                </button>
            </div>

            <div class="lg:col-span-7">
                <div id="repairStage" class="result-frame lg:h-auto flex items-center justify-center relative overflow-hidden" title="双击选择主图">
                    <div id="stageLayers" class="absolute inset-0"></div>
                    <div id="placeholder" class="text-center space-y-4 opacity-20 relative z-10"><i data-lucide="image-plus" class="w-12 h-12 mx-auto stroke-[1px]"></i><p class="text-[10px] font-black tracking-[0.5em] uppercase">双击选择主图</p></div>
                    <div id="loader" class="hidden generation-loader" role="status" aria-live="polite"><div class="generation-loader-wrapper"><div class="generation-loader-animation" aria-hidden="true"><div></div><div></div><div></div><div></div></div><div class="generation-loader-copy"><span class="generation-loader-title" data-i18n="online.generating">Generating</span><span id="loaderElapsed" class="generation-loader-elapsed" aria-hidden="true">0.0s</span></div></div></div>
                </div>
                <div id="timelinePanel" class="timeline-frame">
                    <ul id="timelineList" class="timeline-list"></ul>

                {id:'p1', name:'项目 01', status:'idle', outputs:0, prompt:'', source:'', sourceDim:null, tasks:[], refs:{2:null,3:null}, refDims:{2:null,3:null}, maskDirty:false},
                {id:'p2', name:'项目 02', status:'idle', outputs:0, prompt:'', source:'', sourceDim:null, tasks:[], refs:{2:null,3:null}, refDims:{2:null,3:null}, maskDirty:false}

        async function saveRepairWorkspace(){

                    transaction.oncomplete = resolve;
                    transaction.onerror = () => reject(transaction.error);

        function restoreRepairState(snapshot){
            const saved = snapshot?.state;
            if(!Array.isArray(saved?.projects) || !saved.projects.length) return {};
            const projects = saved.projects.map((project, index) => ({
                id:String(project.id || ('p' + (index + 1))),
                name:String(project.name || ('项目 ' + String(index + 1).padStart(2, '0'))),
                status:project.status === 'running' ? 'idle' : (project.status || 'idle'),

                refDims:{2:project.refDims?.[2] || null, 3:project.refDims?.[3] || null},
                maskDirty:Boolean(project.maskDirty)
            }));
            repairState.projects.splice(0, repairState.projects.length, ...projects);
            repairState.seq = Math.max(Number(saved.seq) || 0, projects.length);
            repairState.active = projects.some(project => project.id === saved.active) ? saved.active : projects[0].id;
            return snapshot.masks || {};

        async function loadRepairWorkspace(){
            try {
                const db = await openRepairStore();
                const snapshot = await new Promise((resolve, reject) => {
                    const request = db.transaction('workspaces', 'readonly').objectStore('workspaces').get(REPAIR_STORE_KEY);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
                db.close();
                return restoreRepairState(snapshot);
            } catch(error) {
                console.warn('repair workspace restore skipped', error);
                return {};
            }

        async function restoreRepairMasks(masks){
            await Promise.all(repairState.projects.map(project => {
                const mask = masks[project.id];
                const {maskCanvas} = projectCanvases(project.id);
                if(!maskCanvas || typeof mask !== 'string' || !mask.startsWith('data:image/png')) return Promise.resolve();
                return new Promise(resolve => {
                    const image = new Image();
                    image.onload = () => {
                        maskCanvas.getContext('2d').drawImage(image, 0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                        project.maskDirty = true;
                        resolve();
                    };
                    image.onerror = resolve;
                    image.src = mask;
                });
            }));

        function escapeRepairHtml(value){

        }
        function makeStageLayer(project){
            const layer = document.createElement('div');

            document.getElementById('stageLayers').appendChild(layer);

            empty.fillStyle = '#f6f7f8'; empty.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            layer.querySelector('.maskCanvas').addEventListener('pointerdown', onMaskPointerDown);
            layer.querySelector('.maskCanvas').addEventListener('pointermove', onMaskPointerMove);

        }
        function setStageBounds(layer, x = 0, y = 0, width = 0, height = 0){
            const bounds = layer?.querySelector('.image-bounds'); if(!bounds) return;
            if(!width || !height){ bounds.className = 'image-bounds guide'; bounds.style.cssText = ''; return; }
            bounds.className = 'image-bounds';
            bounds.style.display = 'block';
            bounds.style.left = `${x / CANVAS_WIDTH * 100}%`;
            bounds.style.top = `${y / CANVAS_HEIGHT * 100}%`;
            bounds.style.width = `${width / CANVAS_WIDTH * 100}%`;
            bounds.style.height = `${height / CANVAS_HEIGHT * 100}%`;

        function drawImageContain(canvas, image){
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#f6f7f8'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            const scale = Math.min(canvas.width / image.naturalWidth, canvas.height / image.naturalHeight);
            const width = image.naturalWidth * scale, height = image.naturalHeight * scale;
            const x = (canvas.width - width) / 2, y = (canvas.height - height) / 2;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(image, x, y, width, height);
            setStageBounds(canvas.closest('.stage-layer'), x, y, width, height);
        }
        function drawProjectSource(project){
            const layer = projectLayer(project.id);

            ctx.clearRect(0, 0, imageCanvas.width, imageCanvas.height);
            ctx.fillStyle = '#f6f7f8'; ctx.fillRect(0, 0, imageCanvas.width, imageCanvas.height);
            if(!project.source){ setStageBounds(projectLayer(project.id)); return; }

        function renderProjectTabs(){

        function startProjectRename(id, tab){

            input.addEventListener('keydown', event => {
                if(event.key === 'Enter'){ event.preventDefault(); finishProjectRename(); }
                if(event.key === 'Escape'){ event.preventDefault(); finishProjectRename(false); }

            input.addEventListener('blur', () => finishProjectRename());

        function syncProjectTabSelection(){
            document.querySelectorAll('.project-tab').forEach(tab => {

        function renderReferenceSlots(){

        function renderTimeline(){
            const project = currentProject();
            const items = project.tasks.slice().reverse().map(task => {
                const stateText = task.status === 'done' ? '完成' : task.status === 'failed' ? '失败' : '生成中';
                const outputUrls = task.status === 'done'
                    ? (Array.isArray(task.outputs) && task.outputs.length ? task.outputs : [task.result]).filter(Boolean)
                    : [];
                const selected = Math.min(Math.max(Number(task.selectedOutput) || 0, 0), Math.max(outputUrls.length - 1, 0));
                const thumbs = outputUrls.length
                    ? `<div class="timeline-outputs">${outputUrls.map((url, index) => `<button class="timeline-output ${index === selected ? 'active' : ''}" type="button" data-project="${project.id}" data-task="${task.id}" data-output="${index}" aria-label="选择第 ${index + 1} 张输出"><img src="${url}" alt="${escapeRepairHtml(project.name)} 输出 ${index + 1}"></button>`).join('')}</div>`
                    : `<div class="timeline-outputs"><span class="timeline-output state">${task.status === 'failed' ? '!' : '<span class="spinner"></span>'}</span></div>`;
                const outputs = outputUrls.length > 1 ? ` · ${outputUrls.length} 张` : '';
                return `<li class="timeline-item ${task.status}">${thumbs}<div class="timeline-meta"><div class="flex items-center gap-2 text-xs"><strong>${task.label}</strong><span class="state">${stateText}${outputs}</span></div><p class="timeline-desc">${escapeRepairHtml(task.prompt)}</p><time class="text-xs text-gray-500">${task.time}</time><button class="continue-btn" type="button" data-project="${project.id}" data-task="${task.id}" ${task.status === 'done' ? '' : 'disabled'}>继续修图</button></div></li>`;
            }).join('');
            document.getElementById('timelineList').innerHTML = items;
        }
        function useTaskOutput(project, task, index = task.selectedOutput){
            const outputs = (Array.isArray(task.outputs) && task.outputs.length ? task.outputs : [task.result]).filter(Boolean);
            const selected = Math.min(Math.max(Number(index) || 0, 0), Math.max(outputs.length - 1, 0));
            if(!outputs[selected]) return false;
            task.selectedOutput = selected;
            project.source = outputs[selected];
            clearProjectMask(project);
            drawProjectSource(project);
            return true;
        }
        function renderRepairUi(options = {}){
            const project = currentProject();
            if(options.renderTabs !== false) renderProjectTabs();
            renderReferenceSlots(); renderTimeline();

            if(document.activeElement !== promptInput) promptInput.value = project.prompt || '';

        function setActiveProject(id){

            syncProjectTabSelection();
            scheduleRepairPersistence();

        function addRepairProject(){

            repairState.projects.push(project); makeStageLayer(project); setActiveProject(id);
            document.getElementById('projectTabs').scrollTo({left:document.getElementById('projectTabs').scrollWidth, behavior:'smooth'});
            scheduleRepairPersistence();

        function maskPosition(event, canvas){
            const rect = canvas.getBoundingClientRect();
            return {x:(event.clientX - rect.left) * canvas.width / rect.width, y:(event.clientY - rect.top) * canvas.height / rect.height};
        }
        function onMaskPointerDown(event){
            if(currentProject().status === 'running' || !currentProject().source) return;
            const canvas = event.currentTarget, ctx = canvas.getContext('2d'), point = maskPosition(event, canvas);
            ctx.globalCompositeOperation = maskTool === 'erase' ? 'destination-out' : 'source-over';
            ctx.strokeStyle = ctx.fillStyle = maskTool === 'erase' ? 'rgba(0,0,0,1)' : 'rgba(17,24,39,.24)';
            ctx.lineWidth = Number(document.getElementById('brushSize').value); ctx.lineCap = ctx.lineJoin = 'round';
            lastMaskPoint = point; maskDrawing = true; currentProject().maskDirty = true;
            ctx.beginPath(); ctx.arc(point.x, point.y, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill();
            canvas.setPointerCapture(event.pointerId);
        }
        function onMaskPointerMove(event){
            if(!maskDrawing || !lastMaskPoint || !currentProject().source) return;
            const canvas = event.currentTarget, ctx = canvas.getContext('2d'), point = maskPosition(event, canvas);
            ctx.beginPath(); ctx.moveTo(lastMaskPoint.x, lastMaskPoint.y); ctx.lineTo(point.x, point.y); ctx.stroke();
            lastMaskPoint = point;
        }
        async function uploadMask(project){
            const {maskCanvas} = projectCanvases(project.id);

            const blob = await new Promise(resolve => maskCanvas.toBlob(resolve, 'image/png'));
            const form = new FormData(); form.append('files', blob, `${project.id}_mask.png`);
            const data = await fetch('/api/ai/upload', {method:'POST', body:form}).then(r => r.json());
            return {...data.files[0], role:'mask', kind:'mask'};

        function finishRepairTask(projectId, taskId, updater){

        async function submitRepair(){

            const btn = document.getElementById('genBtn');
            btn.disabled = true; project.status = 'running'; renderRepairUi();
            const startedAt = performance.now();
            let timerId = null;
            const tick = () => updateLoaderElapsed(performance.now() - startedAt);
            updateLoaderElapsed(0); tick();
            timerId = window.setInterval(tick, 100);
            const task = {
                id:`${project.id}-${project.tasks.length + 1}`,
                label:`#${String(project.tasks.length + 1).padStart(2, '0')}`,
                status:'running', prompt, time:new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'}), result:'', outputs:[], selectedOutput:0
            };
            project.tasks.push(task); renderRepairUi(); scheduleRepairPersistence();
            try {
                const mask = await uploadMask(project);
                const requestRefs = [
                    {url:project.source, role:'source', kind:'image', name:'repair-source'},
                    ...Object.values(project.refs).filter(ref => ref?.url && ref.url !== project.source)
                ];
                if(mask) requestRefs.push(mask);
                const body = {prompt, provider_id:provider, model:selectedModel, size:currentSize(), n:outputCount, reference_images:requestRefs, operation:'edit'};
                if(QUALITY_PROTOCOLS.has(providerProtocol(provider))) body.quality = quality;
                const response = await fetch('/api/online-image', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
                const result = await response.json();
                if(!response.ok) throw new Error(result.detail || '修复失败');
                result.client_duration_ms = Math.round(performance.now() - startedAt);
                if(timerId) window.clearInterval(timerId);
                finishRepairTask(project.id, task.id, (item, current) => {
                    current.status = 'done'; current.result = result.images[0]; current.outputs = result.images || []; current.selectedOutput = 0; current.duration = result.client_duration_ms;
                });
            } catch(error) {
                if(timerId) window.clearInterval(timerId);
                finishRepairTask(project.id, task.id, (item, current) => { current.status = 'failed'; current.prompt = `${prompt} — ${error.message || '修复失败'}`; });

        const ONLINE_SETTINGS_KEY = 'online_image_settings_v1';

        function loadOnlineSettings(){

        const SIZE_OPTIONS = {

            landscape: [
                ['1536x1024', '1k'],

        const RES_LONG_SIDE = { '1k': 1536, '2k': 2048, '4k': 3840 };
        const RES_PIXEL_LIMIT = { '1k': 1572864, '2k': 4194304, '4k': 8294400 };

        function uniqueModels(list){
            const seen = new Set();
            return (list || []).map(item => String(item || '').trim()).filter(item => item && !seen.has(item) && seen.add(item));
        }
        function imageProviders(){
            const list = (apiProviders || []).filter(p => p.enabled !== false && (
                (p.image_models || []).length || (p.rh_apps || []).length || (p.rh_workflows || []).length
            ));
            return list.length ? list : [{id:'comfly', name:'Comfly', image_models:[models.gpt, models.nano]}];
        }
        function providerById(id){
            return imageProviders().find(p => p.id === id) || imageProviders()[0];
        }
        function providerModels(id){
            return uniqueModels(providerById(id)?.image_models || [models.gpt]);
        }
        /* ---- RunningHub：同一平台下同步模型 API / 工作流 / AI 应用。
         * 模型 API 直接提交原始模型名；value=app:ID / workflow:ID 走 RH 应用/工作流路径。 */
        function runningHubEntryId(entry, kind){
            if(!entry || typeof entry !== 'object') return '';
            const raw = kind === 'model' ? (entry.model || entry.id || entry.name)
                : kind === 'workflow' ? (entry.workflowId || entry.id)
                : (entry.appId || entry.webappId || entry.id);
            return String(raw || '').trim();
        }
        function runningHubEntries(id){
            const p = providerById(id) || {};
            const collect = (list, kind) => (list || [])
                .filter(e => e && e.enabled !== false && e.hidden !== true)
                .map(e => ({ kind, id: runningHubEntryId(e, kind), title: String(e.title || e.note || '').trim() }))
                .filter(e => e.id);
            const models = uniqueModels(p.image_models || []).map(model => ({kind:'model', id:model, title:model}));
            return [...models, ...collect(p.rh_workflows, 'workflow'), ...collect(p.rh_apps, 'app')];
        }
        function isRunningHubProvider(id){ return providerProtocol(id) === 'runninghub'; }
        function renderProviderControls(){
            const providerSelect = document.getElementById('providerSelect');
            const modelSelect = document.getElementById('modelSelect');
            const providers = imageProviders();
            if(!providers.some(p => p.id === provider)) provider = providers[0]?.id || 'comfly';
            providerSelect.innerHTML = providers.map(p => `<option value="${escapeHtml(p.id)}" ${p.id === provider ? 'selected' : ''}>${escapeHtml(p.name || p.id)}</option>`).join('');
            if(isRunningHubProvider(provider)){
                const entries = runningHubEntries(provider);
                const keys = entries.map(e => e.kind === 'model' ? e.id : `${e.kind}:${e.id}`);
                if(!keys.includes(selectedModel)) selectedModel = keys[0] || '';
                modelSelect.innerHTML = entries.length
                    ? entries.map(e => {
                        const key = e.kind === 'model' ? e.id : `${e.kind}:${e.id}`;
                        const tag = e.kind === 'model' ? '模型 API' : e.kind === 'workflow' ? tr('online.rhWorkflow') : tr('online.rhApp');
                        const label = e.title || e.id;
                        return `<option value="${escapeHtml(key)}" ${key === selectedModel ? 'selected' : ''}>${escapeHtml(`[${tag}] ${label}`)}</option>`;
                    }).join('')
                    : `<option value="">${escapeHtml(tr('online.rhNoEntries'))}</option>`;
            } else {
                const modelsForProvider = providerModels(provider);
                if(!modelsForProvider.includes(selectedModel)) selectedModel = modelsForProvider[0] || models.gpt;
                modelSelect.innerHTML = modelsForProvider.map(m => `<option value="${escapeHtml(m)}" ${m === selectedModel ? 'selected' : ''}>${escapeHtml(m)}</option>`).join('');
            }
            updateAdaptivePanel();
            saveOnlineSettings();
        }

        /* ---- 协议自适应：根据所选 provider 的 protocol 调整参数栏 ----
         * 后端 /api/online-image → generate_ai_image 已按协议分发，前端只需让
         * 与协议无关的控件随之显隐：质量仅 OpenAI 系（gpt-image）生效，其余协议忽略。 */
        function providerProtocol(id){
            const p = providerById(id) || {};
            const proto = String(p.protocol || '').toLowerCase();
            const pid = String(p.id || '').toLowerCase();
            const base = String(p.base_url || '').toLowerCase();
            if(proto === 'modelscope' || pid === 'modelscope') return 'modelscope';
            if(proto === 'runninghub' || pid === 'runninghub') return 'runninghub';
            if(proto === 'jimeng' || pid === 'jimeng') return 'jimeng';
            if(proto === 'volcengine' || pid === 'volcengine') return 'volcengine';
            if(proto === 'gemini') return 'gemini';
            if(proto === 'apimart' || base.includes('apimart.ai')) return 'apimart';
            return 'api';
        }
        const PROTOCOL_BADGE = {
            api:'online.modeApi', apimart:'online.modeApi', modelscope:'online.modeModelscope',
            runninghub:'online.modeRunningHub', jimeng:'online.modeJimeng',
            volcengine:'online.modeVolcengine', gemini:'online.modeGemini'
        };
        // 仅 OpenAI / APIMart（gpt-image 系）后端会消费 quality；其它协议忽略，隐藏以免误导。
        const QUALITY_PROTOCOLS = new Set(['api','apimart']);
        function updateAdaptivePanel(){
            const proto = providerProtocol(provider);
            const badge = document.getElementById('providerModeBadge');
            if(badge){
                badge.textContent = tr(PROTOCOL_BADGE[proto] || 'online.modeApi');
                badge.style.display = '';
            }
            const qf = document.getElementById('qualityField');
            if(qf) qf.style.display = QUALITY_PROTOCOLS.has(proto) ? '' : 'none';
            const qs = document.getElementById('qualitySelect');
            if(qs) qs.value = quality;
            // RunningHub 每次出图都是一次完整工作流运行，隐藏数量并固定为 1，避免误触发多次昂贵任务。
            if(proto === 'runninghub') outputCount = 1;
            const cf = document.getElementById('countField');
            if(cf) cf.style.display = (proto === 'runninghub') ? 'none' : '';
            const cs = document.getElementById('countSelect');
            if(cs) cs.value = String(outputCount);
        }
        function setQuality(next){ quality = next || 'auto'; saveOnlineSettings(); }
        function setCount(next){ outputCount = Math.max(1, Math.min(4, parseInt(next, 10) || 1)); saveOnlineSettings(); }

        async function initModels(){
            try {
                const cfg = await fetch('/api/config').then(r=>r.json());
                const imageModels = cfg.image_models || [];
                models.nano = imageModels.find(m => m.toLowerCase().includes('nano')) || 'nano-banana-pro';
                models.gpt = imageModels.find(m => !m.toLowerCase().includes('nano')) || cfg.image_model || 'gpt-image-2';
                apiProviders = Array.isArray(cfg.api_providers) ? cfg.api_providers : [];
                const availableModels = providerModels(provider);
                if(!availableModels.includes(selectedModel)) selectedModel = availableModels[0] || models.gpt;
            } catch(e) {}
            renderProviderControls();
        }
        // API 设置页保存后会广播 studio-api 事件；这里重新拉取 /api/config，
        // 尽量保留当前已选的平台/模型，renderProviderControls 会在其不存在时自动回退。
        async function refreshProvidersFromApiSettings(){
            try {
                const cfg = await fetch('/api/config').then(r=>r.json());
                const imageModels = cfg.image_models || [];
                models.nano = imageModels.find(m => m.toLowerCase().includes('nano')) || 'nano-banana-pro';
                models.gpt = imageModels.find(m => !m.toLowerCase().includes('nano')) || cfg.image_model || 'gpt-image-2';
                apiProviders = Array.isArray(cfg.api_providers) ? cfg.api_providers : [];
            } catch(e) { return; }
            renderProviderControls();
        }
        let apiSyncTimer = null;
        function scheduleProviderRefresh(){
            clearTimeout(apiSyncTimer);
            apiSyncTimer = setTimeout(refreshProvidersFromApiSettings, 150);
        }
        try {
            const studioApiChannel = new BroadcastChannel('studio-api');
            studioApiChannel.addEventListener('message', () => scheduleProviderRefresh());
        } catch(e) {}
        // 页面重新可见时也兜底刷新一次（切回标签页 / iframe 重新展示）
        document.addEventListener('visibilitychange', () => { if(!document.hidden) scheduleProviderRefresh(); });

        function setProvider(next){
            provider = next;
            selectedModel = providerModels(provider)[0] || selectedModel;
            renderProviderControls();
        }
        function setModel(next){
            selectedModel = next;
            saveOnlineSettings();
        }
        function escapeHtml(str){ return String(str || '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }

        function parseSizeValue(value){
            const match = String(value || '').trim().match(/^(\d+)\s*[xX*]\s*(\d+)$/);
            return match ? {width:match[1], height:match[2]} : null;
        }
        function customRatioValue(){
            const w = Number(customRatioWidth);
            const h = Number(customRatioHeight);
            return w > 0 && h > 0 ? w / h : null;
        }
        function customSizeValue(){
            const w = Number(customWidth);
            const h = Number(customHeight);
            return w > 0 && h > 0 ? `${Math.round(w)}x${Math.round(h)}` : '';
        }
        function getImageDimensions(src){
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve({width:img.naturalWidth, height:img.naturalHeight});
                img.onerror = reject;
                img.src = src;
            });
        }
        function firstReferenceDimension(){
            const project = currentProject();
            return project.sourceDim || [2,3].map(id => refDims[id]).find(dim => dim?.width && dim?.height) || null;
        }

        function setRatio(next, preferredSize = ''){
            ratio = next;
            if (preferredSize) {
                const match = SIZE_OPTIONS[next]?.find(([value]) => value === preferredSize);
                if (match) resolution = match[1];
            }
            if(next !== 'custom') {
                customRatioWidth = '';
                customRatioHeight = '';
            }
            updateSizeUI();
            saveOnlineSettings();
        }

        function setCustomRatio(){
            customRatioWidth = document.getElementById('ratioCustomWidth').value;
            customRatioHeight = document.getElementById('ratioCustomHeight').value;
            ratio = 'custom';
            updateSizeUI();
            saveOnlineSettings();
        }

        function setCustomSize(){
            customWidth = document.getElementById('sizeCustomWidth').value;
            customHeight = document.getElementById('sizeCustomHeight').value;
            resolution = 'custom';
            ratio = '';
            updateSizeUI();
            saveOnlineSettings();
        }

        function setResolution(next){
            resolution = next;
            if(next === 'custom'){
                ratio = '';
            } else {
                customWidth = '';
                customHeight = '';
                if(ratio === '') ratio = 'square';
            }
            updateSizeUI();
            saveOnlineSettings();
        }

        function updateSizeUI(){
            const ratioSelect = document.getElementById('ratioSelect');
            const ratioField = document.getElementById('ratioField');
            const ratioCustomWidthInput = document.getElementById('ratioCustomWidth');
            const ratioCustomHeightInput = document.getElementById('ratioCustomHeight');
            const resolutionSelect = document.getElementById('resolutionSelect');
            const resolutionField = document.getElementById('resolutionField');
            const sizeCustomWidthInput = document.getElementById('sizeCustomWidth');
            const sizeCustomHeightInput = document.getElementById('sizeCustomHeight');
            const fitImageSizeBtn = document.getElementById('fitImageSizeBtn');
            ratioSelect.value = ratio;
            ratioSelect.disabled = resolution === 'custom';
            ratioField.classList.toggle('custom', ratio === 'custom');
            ratioCustomWidthInput.value = customRatioWidth;
            ratioCustomHeightInput.value = customRatioHeight;
            resolutionSelect.value = resolution;
            resolutionField.classList.toggle('custom', resolution === 'custom');
            sizeCustomWidthInput.value = customWidth;
            sizeCustomHeightInput.value = customHeight;
            if(fitImageSizeBtn) fitImageSizeBtn.disabled = !firstReferenceDimension();
            updateResolutionUI();
        }

        function updateResolutionUI(){}
        function fitCustomSizeToImage(event){
            if(event) event.preventDefault();
            const dim = firstReferenceDimension();
            if(!dim) return;
            resolution = 'custom';
            ratio = '';
            customWidth = dim.width;
            customHeight = dim.height;
            updateSizeUI();
            saveOnlineSettings();
        }

        function currentSize(){
            if(resolution === 'custom') return customSizeValue();
            const options = SIZE_OPTIONS[ratio] || SIZE_OPTIONS.square;
            if(ratio === 'custom'){
                const parsed = customRatioValue();
                const longSide = RES_LONG_SIDE[resolution] || 1024;
                if(parsed){
                    const pixelLimit = RES_PIXEL_LIMIT[resolution] || (longSide * longSide);
                    const rawWidth = parsed >= 1 ? longSide : Math.min(longSide * parsed, Math.sqrt(pixelLimit * parsed));
                    const rawHeight = parsed >= 1 ? Math.min(longSide / parsed, Math.sqrt(pixelLimit / parsed)) : longSide;
                    const width = Math.floor(rawWidth / 16) * 16;
                    const height = Math.floor(rawHeight / 16) * 16;
                    return `${Math.max(64, width)}x${Math.max(64, height)}`;
                }
            }
            const match = options.find(([, label]) => label === resolution) || SIZE_OPTIONS.square.find(([, label]) => label === resolution) || SIZE_OPTIONS.square[0];
            return match[0];
        }

        [2,3].forEach(id => {
            const zone = document.getElementById(`drop-zone-${id}`);
            zone.ondragover = e => { e.preventDefault(); zone.classList.add('drag-over'); };
            zone.ondragleave = () => zone.classList.remove('drag-over');
            zone.ondrop = e => { e.preventDefault(); zone.classList.remove('drag-over'); handleFile(e.dataTransfer.files[0], id); };
        });
        window.addEventListener('paste', e => {
            const item = [...(e.clipboardData?.items || [])].find(x => x.kind === 'file' && x.type.startsWith('image/'));
            if (item) handleFile(item.getAsFile(), firstEmptySlot());
        });
        function firstEmptySlot(){ return [2,3].find(id => !refs[id]) || 2; }

        async function handleFile(file, index){
            if(!file) return;
            if(index === 1){
                const form = new FormData(); form.append('files', file);
                const data = await fetch('/api/ai/upload', {method:'POST', body:form}).then(r=>r.json());
                const project = currentProject();
                project.source = data.files[0].url;
                drawProjectSource(project); renderRepairUi(); scheduleRepairPersistence();
                return;
            }
            const reader = new FileReader();
            reader.onload = e => {
                const prev = document.getElementById(`prev${index}`);
                prev.src = e.target.result; prev.classList.remove('hidden');
                document.getElementById(`del${index}`).classList.remove('hidden');
                getImageDimensions(e.target.result).then(dim => {
                    refDims[index] = dim;
                    updateSizeUI();
                }).catch(() => {});
            };
            reader.readAsDataURL(file);
            const form = new FormData();
            form.append('files', file);
            const data = await fetch('/api/ai/upload', {method:'POST', body:form}).then(r=>r.json());
            refs[index] = data.files[0];
            renderRepairUi();
            scheduleRepairPersistence();
        }
        function clearSlot(index, ev){
            if(ev) ev.stopPropagation();
            refs[index] = null;
            refDims[index] = null;
            document.getElementById(`prev${index}`).src = '';
            document.getElementById(`prev${index}`).classList.add('hidden');
            document.getElementById(`del${index}`).classList.add('hidden');
            renderRepairUi();
            scheduleRepairPersistence();
        }

        function formatDuration(ms){
            const seconds = Math.max(0, Number(ms) || 0) / 1000;
            return `${seconds.toFixed(1)}${window.StudioI18n?.lang?.() === 'en' ? 's' : '秒'}`;
        }
        function updateLoaderElapsed(ms){
            const el = document.getElementById('loaderElapsed');
            if(el) el.textContent = formatDuration(ms);
        }
        function bindRepairEvents(){
            document.getElementById('projectTabs').addEventListener('click', event => {
                const tab = event.target.closest('.project-tab'); if(tab) setActiveProject(tab.dataset.project);
            });
            document.getElementById('projectTabs').addEventListener('dblclick', event => {
                const tab = event.target.closest('.project-tab');
                if(tab){ event.preventDefault(); startProjectRename(tab.dataset.project, tab); }
            });
            document.getElementById('addProjectBtn').addEventListener('click', addRepairProject);
            document.getElementById('repairStage').addEventListener('dblclick', () => {
                if(currentProject().status !== 'running') document.getElementById('file1').click();
            });
            const repairStage = document.getElementById('repairStage');
            repairStage.addEventListener('dragover', event => {
                if(currentProject().status === 'running') return;
                const file = [...(event.dataTransfer?.items || [])].some(item => item.kind === 'file' && item.type.startsWith('image/'));
                if(!file) return;
                event.preventDefault();
                repairStage.classList.add('drag-over');
            });
            repairStage.addEventListener('dragleave', event => {
                if(!repairStage.contains(event.relatedTarget)) repairStage.classList.remove('drag-over');
            });
            repairStage.addEventListener('drop', event => {
                event.preventDefault();
                repairStage.classList.remove('drag-over');
                if(currentProject().status !== 'running') handleFile([...event.dataTransfer.files].find(file => file.type.startsWith('image/')), 1);
            });
            document.getElementById('toolMask').addEventListener('click', () => { maskTool='mask'; toolMask.classList.add('active'); toolErase.classList.remove('active'); });
            document.getElementById('toolErase').addEventListener('click', () => { maskTool='erase'; toolErase.classList.add('active'); toolMask.classList.remove('active'); });
            document.getElementById('brushSize').addEventListener('input', () => document.getElementById('brushValue').textContent = document.getElementById('brushSize').value);
            document.getElementById('clearMask').addEventListener('click', () => { clearProjectMask(currentProject()); });
            document.getElementById('timelinePanel').addEventListener('click', event => {
                const outputButton = event.target.closest('.timeline-output[data-output]');
                if(outputButton){
                    const project = repairState.projects.find(item => item.id === outputButton.dataset.project);
                    const task = project?.tasks.find(item => item.id === outputButton.dataset.task);
                    if(project && task && useTaskOutput(project, task, outputButton.dataset.output)){
                        setActiveProject(project.id);
                        renderRepairUi();
                        scheduleRepairPersistence();
                    }
                    return;
                }
                const button = event.target.closest('.continue-btn'); if(!button || button.disabled) return;
                const project = repairState.projects.find(item => item.id === button.dataset.project);
                const task = project?.tasks.find(item => item.id === button.dataset.task);
                if(project && task && useTaskOutput(project, task)){ setActiveProject(project.id); renderRepairUi(); scheduleRepairPersistence(); }
            });
            document.getElementById('promptInput').addEventListener('input', () => {
                currentProject().prompt = document.getElementById('promptInput').value.trim();
                scheduleRepairPersistence();
            });
            window.addEventListener('pointerup', () => {
                if(maskDrawing) scheduleRepairPersistence();
                maskDrawing = false; lastMaskPoint = null;
            });
            window.addEventListener('pagehide', () => {
                clearTimeout(repairPersistTimer);
                repairPersistTimer = null;
                saveRepairWorkspace().catch(() => {});
            });
        }
        window.onload = async () => {
            loadOnlineSettings();
            const masks = await loadRepairWorkspace();
            applyLanguage();
            repairState.projects.forEach(project => { makeStageLayer(project); drawProjectSource(project); });
            await restoreRepairMasks(masks);
            refs = currentProject().refs; refDims = currentProject().refDims;
            bindRepairEvents(); renderRepairUi();
            await initModels(); updateSizeUI();
        };
    </script>
</body>
</html>
